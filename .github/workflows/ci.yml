name: Check release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test, inspect, and build
        run: python tools/check_release.py
      - name: Save release candidates
        if: matrix.python == '3.14'
        uses: actions/upload-artifact@v6
        with:
          name: cc-up-release-candidate
          path: |
            dist/CC-Up-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
